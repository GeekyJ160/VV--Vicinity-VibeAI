
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VV — Vicinity Vibe</title>
    <meta name="description" content="VV · Vicinity Vibe — Real-time location social. Swipe, sync, explore your vicinity.">
    <meta name="theme-color" content="#0d0a1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VV">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://picsum.photos/id/64/180/180">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0d0a1e; color: white; margin: 0; overscroll-behavior: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(232,121,249,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(232,121,249,0.6); }

        @keyframes vv-pulse-ring {
          0% { transform: scale(1); opacity: 0.6; }
          100% { transform: scale(1.7); opacity: 0; }
        }
        @keyframes vv-float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-8px); }
        }
        @keyframes vv-shimmer {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        @keyframes vv-glow-pulse {
          0%, 100% { box-shadow: 0 0 20px rgba(232,121,249,0.4), 0 0 40px rgba(168,85,247,0.2); }
          50% { box-shadow: 0 0 40px rgba(232,121,249,0.7), 0 0 80px rgba(168,85,247,0.4); }
        }
        @keyframes vv-spin-slow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes vv-slide-up {
          from { transform: translateY(30px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        @keyframes progress {
          0% { width: 0%; }
          100% { width: 100%; }
        }
        @keyframes floatUp {
          0% { transform: translateY(0) scale(1); opacity: 1; }
          100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }
        @keyframes vv-ripple {
          0% { transform: scale(0); opacity: 1; }
          100% { transform: scale(4); opacity: 0; }
        }
        @keyframes vv-bounce-in {
          0% { transform: scale(0.3); opacity: 0; }
          50% { transform: scale(1.1); }
          70% { transform: scale(0.9); }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes vv-gradient-shift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes vv-stars {
          0%, 100% { opacity: 0; }
          50% { opacity: 1; }
        }

        .vv-pulse-ring::after {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid currentColor;
          animation: vv-pulse-ring 1.5s ease-out infinite;
        }
        .vv-float { animation: vv-float 3s ease-in-out infinite; }
        .vv-glow { animation: vv-glow-pulse 2s ease-in-out infinite; }
        .vv-spin-slow { animation: vv-spin-slow 8s linear infinite; }
        .vv-slide-up { animation: vv-slide-up 0.4s ease forwards; }
        .vv-bounce-in { animation: vv-bounce-in 0.5s ease forwards; }

        .vv-shimmer-text {
          background: linear-gradient(90deg, #e879f9, #a855f7, #7c3aed, #e879f9);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: vv-shimmer 3s linear infinite;
        }

        .vv-gradient-bg {
          background: linear-gradient(135deg, #e879f9, #a855f7, #7c3aed, #6d28d9);
          background-size: 300% 300%;
          animation: vv-gradient-shift 4s ease infinite;
        }

        .vv-glass {
          background: rgba(255,255,255,0.04);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.08);
        }
        .vv-glass-strong {
          background: rgba(255,255,255,0.07);
          backdrop-filter: blur(32px);
          -webkit-backdrop-filter: blur(32px);
          border: 1px solid rgba(255,255,255,0.12);
        }

        .vv-card-hover {
          transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .vv-card-hover:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 20px rgba(232,121,249,0.15);
        }

        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .vv-nav-active {
          background: linear-gradient(135deg, rgba(232,121,249,0.25), rgba(168,85,247,0.15));
          box-shadow: 0 0 20px rgba(232,121,249,0.2);
        }

        input, textarea, select { font-family: 'DM Sans', sans-serif; }
        button { font-family: 'DM Sans', sans-serif; }

        .line-clamp-2 {
          overflow: hidden;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
        }
        .line-clamp-3 {
          overflow: hidden;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
        }

        /* Animate in utilities */
        .animate-in { animation: vv-slide-up 0.4s ease forwards; }
        .fade-in { animation: vv-fade-in 0.4s ease forwards; }
        @keyframes vv-fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .zoom-in { animation: vv-bounce-in 0.4s ease forwards; }
        .slide-in-from-bottom-8 { animation: vv-slide-up 0.3s ease forwards; }
        .slide-in-from-top-2 {
          animation: vv-slide-down 0.2s ease forwards;
        }
        @keyframes vv-slide-down {
          from { transform: translateY(-10px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        .duration-200 { animation-duration: 0.2s; }
        .duration-300 { animation-duration: 0.3s; }
        .duration-500 { animation-duration: 0.5s; }
        .duration-700 { animation-duration: 0.7s; }
    </style>
